<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediBook - حجز موعد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;color:#0f172a}
.wrap{max-width:900px;margin:0 auto}
h1{color:white;text-align:center;margin-bottom:20px;font-size:1.8rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.st{background:rgba(255,255,255,0.15);padding:14px;border-radius:12px;color:white;text-align:center;border:1px solid rgba(255,255,255,0.3)}
.st b{display:block;font-size:1.6rem}
.st span{font-size:0.8rem;opacity:0.9}
.tabs{display:flex;background:white;border-radius:12px;padding:5px;margin-bottom:20px;gap:5px}
.tab{flex:1;padding:12px;border:none;background:transparent;border-radius:9px;font-weight:700;color:#64748b;cursor:pointer;font-family:inherit;font-size:0.9rem}
.tab.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
.panel{background:white;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,0.15);display:none}
.panel.on{display:block}
h2{font-size:1.2rem;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #f1f5f9;color:#0f172a}
label{display:block;margin-bottom:6px;font-weight:700;color:#334155;font-size:0.9rem}
input,select,textarea{width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;font-family:inherit;background:#f8fafc;margin-bottom:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:#6366f1;background:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.doc{border:2px solid #e2e8f0;border-radius:12px;padding:15px;text-align:center;cursor:pointer;position:relative;transition:0.3s}
.doc:hover{border-color:#6366f1;transform:translateY(-3px)}
.doc.sel{border-color:#6366f1;background:rgba(99,102,241,0.05);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.doc.sel::after{content:'✓';position:absolute;top:8px;left:8px;background:#10b981;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.85rem}
.av{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin:0 auto 10px}
.nm{font-weight:800;font-size:0.95rem;margin-bottom:4px}
.sp{color:#6366f1;font-size:0.8rem;font-weight:600;background:rgba(99,102,241,0.1);padding:2px 8px;border-radius:15px;display:inline-block;margin-bottom:5px}
.rt{color:#f59e0b;font-size:0.8rem;font-weight:600}
.pr{color:#10b981;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0}
.btn{width:100%;padding:15px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border:none;border-radius:12px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(99,102,241,0.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(99,102,241,0.5)}
.apt{border:2px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;overflow:hidden}
.apt::before{content:'';position:absolute;right:0;top:0;bottom:0;width:5px;background:#f59e0b}
.apt.confirmed::before{background:#10b981}
.apt.cancelled::before{background:#ef4444}
.apt.cancelled{opacity:0.6}
.apt-i{flex:1;min-width:200px}
.apt-i h4{margin-bottom:5px}
.apt-i p{color:#64748b;font-size:0.9rem;margin:3px 0}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end}
.sm{padding:8px 14px;border:none;border-radius:8px;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:inherit;color:white}
.grn{background:#10b981}.red{background:#ef4444}.blu{background:#3b82f6}
.bdg{padding:3px 10px;border-radius:15px;font-size:0.75rem;font-weight:700;display:inline-block}
.bdg.pending{background:#fef3c7;color:#92400e}
.bdg.confirmed{background:#d1fae5;color:#065f46}
.bdg.cancelled{background:#fee2e2;color:#991b1b}
.empty{text-align:center;color:#94a3b8;padding:40px;font-size:1rem}
.filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.flt{padding:8px 16px;border:2px solid #e2e8f0;background:white;border-radius:20px;font-weight:700;font-size:0.85rem;color:#64748b;cursor:pointer;font-family:inherit}
.flt.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border-color:transparent}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-200px);background:#10b981;color:white;padding:15px 25px;border-radius:12px;font-weight:700;box-shadow:0 15px 40px rgba(0,0,0,0.25);z-index:9999;transition:0.4s;font-family:'Cairo',sans-serif;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:#ef4444}
.back{color:white;text-decoration:none;font-weight:700;display:inline-block;margin-bottom:15px}
</style>
</head>
<body>
<div class="wrap">
<a href="index.html" class="back">← رجوع للرئيسية</a>
<h1>🏥 MediBook - نظام الحجز</h1>

<div class="stats">
  <div class="st"><b id="statTotal">0</b><span>إجمالي</span></div>
  <div class="st"><b id="statPending">0</b><span>قيد الانتظار</span></div>
  <div class="st"><b id="statConfirmed">0</b><span>مؤكدة</span></div>
  <div class="st"><b id="statDoctors">0</b><span>أطباء</span></div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="booking">📅 حجز موعد</button>
  <button class="tab" data-tab="appointments">📋 مواعيدي</button>
  <button class="tab" data-tab="doctors">👨‍⚕️ الأطباء</button>
</div>

<div class="panel on" id="panel-booking">
  <h2>📅 احجز موعدك</h2>
  <label>الاسم الكامل *</label>
  <input type="text" id="pName" placeholder="مثال: أحمد محمد">
  <label>رقم الهاتف *</label>
  <input type="tel" id="pPhone" placeholder="01xxxxxxxxx">
  <label>اختر الطبيب *</label>
  <div class="grid" id="docsGrid"></div>
  <label>التاريخ *</label>
  <input type="date" id="pDate">
  <label>الوقت *</label>
  <select id="pTime">
    <option value="">اختر الوقت</option>
    <option>09:00 ص</option><option>10:00 ص</option><option>11:00 ص</option>
    <option>12:00 م</option><option>02:00 م</option><option>03:00 م</option>
    <option>04:00 م</option><option>05:00 م</option><option>06:00 م</option><option>07:00 م</option>
  </select>
  <label>ملاحظات (اختياري)</label>
  <textarea id="pNotes" rows="2" placeholder="أي ملاحظات..."></textarea>
  <button class="btn" id="bookBtn">✅ تأكيد الحجز</button>
</div>

<div class="panel" id="panel-appointments">
  <h2>📋 مواعيدي</h2>
  <div class="filter">
    <button class="flt on" data-filter="all">الكل</button>
    <button class="flt" data-filter="pending">⏳ قيد الانتظار</button>
    <button class="flt" data-filter="confirmed">✅ مؤكدة</button>
    <button class="flt" data-filter="cancelled">❌ ملغية</button>
  </div>
  <div id="aptsList"></div>
</div>

<div class="panel" id="panel-doctors">
  <h2>👨‍⚕️ فريقنا الطبي</h2>
  <div class="grid" id="allDocsGrid"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
var DOCTORS = [
  { id:1, name:'د. أحمد محمود', spec:'قلب وأوعية دموية', price:300, icon:'❤️', rating:4.8, exp:15 },
  { id:2, name:'د. سارة علي', spec:'طب الأطفال', price:200, icon:'👶', rating:4.9, exp:10 },
  { id:3, name:'د. محمد حسن', spec:'جراحة العظام', price:250, icon:'🦴', rating:4.7, exp:12 },
  { id:4, name:'د. فاطمة إبراهيم', spec:'الجلدية', price:220, icon:'✨', rating:4.8, exp:8 },
  { id:5, name:'د. خالد عمر', spec:'طب الأسنان', price:280, icon:'🦷', rating:4.6, exp:14 },
  { id:6, name:'د. نور الهدى', spec:'النساء والتوليد', price:350, icon:'🌸', rating:4.9, exp:18 }
];
var selectedDoctorId = null;
var appointments = [];
var currentFilter = 'all';

function loadData() {
  try { appointments = JSON.parse(localStorage.getItem('medibook_appointments') || '[]'); } catch(e) { appointments = []; }
}
function saveData() {
  try { localStorage.setItem('medibook_appointments', JSON.stringify(appointments)); } catch(e) {}
}
function showToast(msg, isError) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' err' : '');
  setTimeout(function() { t.className = 'toast' + (isError ? ' err' : ''); }, 2500);
}
function switchTab(name) {
  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  for (var j = 0; j < panels.length; j++) panels[j].classList.remove('on');
  document.querySelector('.tab[data-tab="' + name + '"]').classList.add('on');
  document.getElementById('panel-' + name).classList.add('on');
  if (name === 'appointments') renderAppointments();
  if (name === 'doctors') renderAllDoctors();
}

//     var d = DOCTORS[i];

//     var d = DOCTORS[i];
//     html += '<div class="doc" style="cursor:default">' +
//       '<div class="av">' + d.icon + '</div>' +
//       '<div class="nm">' + d.name + '</div>' +
//       '<div class="sp">' + d.spec + '</div>' +
//       '<div class="rt">⭐ ' + d.rating + ' (' + d.exp + ' سنة)</div>' +
//       '<div class="pr">' + d.price + ' ج.م</div>' +
//     '</div>';

function renderDoctors() {
  var grid = document.getElementById('docsGrid');
  var html = '';
  var availableCount = 0;
  
  // جلب أسماء الأطباء اللي عندهم حجز نشط (pending أو confirmed)
  var bookedDoctors = [];
  for (var k = 0; k < appointments.length; k++) {
    if (appointments[k].status === 'pending' || appointments[k].status === 'confirmed') {
      bookedDoctors.push(appointments[k].doctorName);
    }
  }
  
  for (var i = 0; i < DOCTORS.length; i++) {
    var d = DOCTORS[i];
    
    // تخطي الدكتور لو عنده حجز نشط
    if (bookedDoctors.indexOf(d.name) !== -1) continue;
    
    availableCount++;
    var sel = (selectedDoctorId === d.id) ? ' sel' : '';
    html += '<div class="doc' + sel + '" data-id="' + d.id + '">' +
      '<div class="av">' + d.icon + '</div>' +
      '<div class="nm">' + d.name + '</div>' +
      '<div class="sp">' + d.spec + '</div>' +
      '<div class="rt">⭐ ' + d.rating + '</div>' +
      '<div class="pr">' + d.price + ' ج.م</div>' +
    '</div>';
  }
  
  // لو كل الأطباء محجوزين
  if (availableCount === 0) {
    html = '<div style="grid-column:1/-1;text-align:center;padding:30px;color:#94a3b8;">' +
           '<div style="font-size:3rem;margin-bottom:10px;">😔</div>' +
           '<h3 style="color:#0f172a;margin-bottom:8px;">كل الأطباء محجوزين حالياً</h3>' +
           '<p>من فضلك ألغِ حجز سابق أو انتظر تأكيد الموعد</p>' +
           '</div>';
  }
  
  grid.innerHTML = html;
  var cards = grid.querySelectorAll('.doc');
  for (var j = 0; j < cards.length; j++) {
    cards[j].addEventListener('click', function() {
      selectDoctor(parseInt(this.getAttribute('data-id')));
    });
  }
}
function selectDoctor(id) {
  selectedDoctorId = id;
  var cards = document.querySelectorAll('#docsGrid .doc');
  for (var i = 0; i < cards.length; i++) {
    if (parseInt(cards[i].getAttribute('data-id')) === id) cards[i].classList.add('sel');
    else cards[i].classList.remove('sel');
  }
}
function bookAppointment() {
  var name = document.getElementById('pName').value.trim();
  var phone = document.getElementById('pPhone').value.trim();
  var date = document.getElementById('pDate').value;
  var time = document.getElementById('pTime').value;
  var notes = document.getElementById('pNotes').value.trim();
  
  if (!name) { showToast('❌ أدخل الاسم', true); return; }
  if (!phone || !/^01[0-9]{9}$/.test(phone)) { showToast('❌ رقم هاتف غير صحيح', true); return; }
  if (!selectedDoctorId) { showToast('❌ اختر طبيباً', true); return; }
  if (!date) { showToast('❌ اختر التاريخ', true); return; }
  if (!time) { showToast('❌ اختر الوقت', true); return; }
  
  var doctor = null;
  for (var i = 0; i < DOCTORS.length; i++) {
    if (DOCTORS[i].id === selectedDoctorId) { doctor = DOCTORS[i]; break; }
  }
  if (!doctor) { showToast('❌ خطأ', true); return; }
  
  for (var k = 0; k < appointments.length; k++) {
    var a = appointments[k];
    if (a.doctorName === doctor.name && a.date === date && a.time === time && a.status !== 'cancelled') {
      showToast('⚠️ هذا الوقت محجوز', true); return;
    }
  }
  
  appointments.push({
    id: Date.now(), patientName: name, phone: phone,
    doctorName: doctor.name, doctorSpec: doctor.spec, doctorIcon: doctor.icon,
    price: doctor.price, date: date, time: time, notes: notes,
    status: 'pending', createdAt: new Date().toISOString()
  });
  saveData(); updateStats();
  showToast('✅ تم حجز الموعد بنجاح');
  document.getElementById('pName').value = '';
  document.getElementById('pPhone').value = '';
  document.getElementById('pDate').value = '';
  document.getElementById('pTime').value = '';
  document.getElementById('pNotes').value = '';
  selectedDoctorId = null;
  var cards = document.querySelectorAll('#docsGrid .doc');
  for (var x = 0; x < cards.length; x++) cards[x].classList.remove('sel');
  setTimeout(function() { switchTab('appointments'); }, 1200);
}
function renderAppointments() {
  var list = document.getElementById('aptsList');
  var filtered = [];
  for (var i = 0; i < appointments.length; i++) {
    if (currentFilter === 'all' || appointments[i].status === currentFilter) filtered.push(appointments[i]);
  }
  filtered.sort(function(a, b) { return b.createdAt.localeCompare(a.createdAt); });
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">📭 لا توجد مواعيد</div>';
    return;
  }
  var statusText = { pending:'⏳ قيد الانتظار', confirmed:'✅ مؤكد', cancelled:'❌ ملغي' };
  var html = '';
  for (var j = 0; j < filtered.length; j++) {
    var a = filtered[j];
    var btns = '';
    if (a.status === 'pending') {
      btns = '<button class="sm grn" data-a="confirm" data-id="' + a.id + '">✔️ تأكيد</button>' +
             '<button class="sm red" data-a="cancel" data-id="' + a.id + '">✖️ إلغاء</button>';
    } else if (a.status === 'confirmed') {
      btns = '<button class="sm blu" data-a="print" data-id="' + a.id + '">🖨️ طباعة</button>' +
             '<button class="sm red" data-a="cancel" data-id="' + a.id + '">✖️ إلغاء</button>';
    } else {
      btns = '<button class="sm red" data-a="delete" data-id="' + a.id + '">🗑️ حذف</button>';
    }
    html += '<div class="apt ' + a.status + '">' +
      '<div class="apt-i">' +
        '<h4>' + a.doctorIcon + ' ' + a.doctorName + '</h4>' +
        '<p>👤 ' + a.patientName + ' | 📞 ' + a.phone + '</p>' +
        '<p>📅 ' + a.date + ' ⏰ ' + a.time + ' | 💰 ' + a.price + ' ج.م</p>' +
        '<p><span class="bdg ' + a.status + '">' + statusText[a.status] + '</span></p>' +
        (a.notes ? '<p>📝 ' + a.notes + '</p>' : '') +
      '</div>' +
      '<div class="acts">' + btns + '</div>' +
    '</div>';
  }
  list.innerHTML = html;
  var actionBtns = list.querySelectorAll('[data-a]');
  for (var x = 0; x < actionBtns.length; x++) {
    actionBtns[x].addEventListener('click', function() {
      var act = this.getAttribute('data-a');
      var id = parseInt(this.getAttribute('data-id'));
      if (act === 'confirm') confirmApt(id);
      else if (act === 'cancel') cancelApt(id);
      else if (act === 'delete') deleteApt(id);
      else if (act === 'print') printApt(id);
    });
  }
}
function confirmApt(id) {
  for (var i = 0; i < appointments.length; i++) {
    if (appointments[i].id === id) { appointments[i].status = 'confirmed'; break; }
  }
  saveData(); updateStats(); renderAppointments();
  showToast('✅ تم التأكيد');
}
function cancelApt(id) {
  if (!confirm('إلغاء الموعد؟')) return;
  for (var i = 0; i < appointments.length; i++) {
    if (appointments[i].id === id) { appointments[i].status = 'cancelled'; break; }
  }
  saveData(); updateStats(); renderAppointments();
  showToast('تم الإلغاء', true);
}
function deleteApt(id) {
  if (!confirm('حذف الموعد؟')) return;
  var arr = [];
  for (var i = 0; i < appointments.length; i++) {
    if (appointments[i].id !== id) arr.push(appointments[i]);
  }
  appointments = arr;
  saveData(); updateStats(); renderAppointments();
  showToast('🗑️ تم الحذف');
}
function printApt(id) {
  var a = null;
  for (var i = 0; i < appointments.length; i++) {
    if (appointments[i].id === id) { a = appointments[i]; break; }
  }
  if (!a) return;
  var w = window.open('', '', 'width=600,height=700');
  w.document.write('<html dir="rtl"><head><title>تذكرة</title><style>body{font-family:Arial;padding:30px}.t{border:3px dashed #6366f1;border-radius:15px;padding:25px}h1{color:#6366f1;text-align:center}.r{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.l{font-weight:bold;color:#666}</style></head><body><div class="t"><h1>🏥 MediBook</h1><div class="r"><span class="l">الطبيب:</span><span>' + a.doctorIcon + ' ' + a.doctorName + '</span></div><div class="r"><span class="l">التخصص:</span><span>' + a.doctorSpec + '</span></div><div class="r"><span class="l">المريض:</span><span>' + a.patientName + '</span></div><div class="r"><span class="l">الهاتف:</span><span>' + a.phone + '</span></div><div class="r"><span class="l">التاريخ:</span><span>' + a.date + '</span></div><div class="r"><span class="l">الوقت:</span><span>' + a.time + '</span></div><div class="r"><span class="l">السعر:</span><span>' + a.price + ' ج.م</span></div></div><script>window.print();<\/script></body></html>');
  w.document.close();
}
function updateStats() {
  document.getElementById('statTotal').textContent = appointments.length;
  var p = 0, c = 0;
  for (var i = 0; i < appointments.length; i++) {
    if (appointments[i].status === 'pending') p++;
    if (appointments[i].status === 'confirmed') c++;
  }
  document.getElementById('statPending').textContent = p;
  document.getElementById('statConfirmed').textContent = c;
  document.getElementById('statDoctors').textContent = DOCTORS.length;
}
function init() {
  loadData();
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', function() {
      switchTab(this.getAttribute('data-tab'));
    });
  }
  var filters = document.querySelectorAll('.flt');
  for (var j = 0; j < filters.length; j++) {
    filters[j].addEventListener('click', function() {
      var all = document.querySelectorAll('.flt');
      for (var x = 0; x < all.length; x++) all[x].classList.remove('on');
      this.classList.add('on');
      currentFilter = this.getAttribute('data-filter');
      renderAppointments();
    });
  }
  document.getElementById('bookBtn').addEventListener('click', bookAppointment);
  document.getElementById('pDate').min = new Date().toISOString().split('T')[0];
